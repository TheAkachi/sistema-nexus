name: Verificar gestão
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: bash -n scripts/backup/executar.sh scripts/backup/restaurar-isolado.sh
      - run: bash tests/backup-operacao.sh
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gestao_test
          POSTGRES_PASSWORD: test_only_not_for_production
          POSTGRES_DB: gestao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gestao_test:test_only_not_for_production@127.0.0.1:5432/gestao_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test --test-concurrency=1 tests/api/banco.test.mjs tests/api/backup.test.mjs tests/api/fila.test.mjs tests/api/sincronizacao.test.mjs tests/api/concorrencia-postgres.test.mjs
